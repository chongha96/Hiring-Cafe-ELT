[project]
name = "hiring-cafe-crawler-etl"
version = "0.1.0"
description = "End-to-end data pipeline for web-crawled U.S. job listing data from Hiring Cafe"
readme = "README.md"
requires-python = ">=3.10,<3.14"

dependencies = [
    "python-dotenv>=1.0.0",
    "polars>=1.0.0",
    "pyspark==3.5.8",
]

[project.optional-dependencies]
crawler = [
    "beautifulsoup4>=4.12.0",
    "seleniumbase>=4.0.0",
]

dbt = [
    "dbt-bigquery==1.7.9",
    "protobuf==4.25.3",
]

[project.scripts]
run-crawler = "crawler.main:main"

[tool.setuptools]
packages = ["crawler"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"